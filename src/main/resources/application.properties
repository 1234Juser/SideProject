spring.application.name=nowpick

logging.level.root = INFO
logging.level.com.hello = DEBUG
logging.file.name = logs/application.log

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/nowpickdb?allowPublicKeyRetrieval=true&useSSL=false&useUnicode=true&serverTimezone=Asia/Seoul
spring.datasource.username=nowpick
spring.datasource.password=nowpick

# JPA ? Hibernate ??
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true

# SQL ??? ?? (Spring Boot 2.5 ?? ??)
spring.sql.init.mode=always
