spring.application.name=nowpick

logging.level.root = INFO
logging.level.com.nowpick = DEBUG
logging.file.name = logs/application.log

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/nowpickdb?allowPublicKeyRetrieval=true&useSSL=false&useUnicode=true&serverTimezone=Asia/Seoul
spring.datasource.username=nowpick
spring.datasource.password=nowpick

# JPA \uBC0F Hibernate \uC124\uC815
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

# SQL \uCD08\uAE30\uD654 \uC124\uC815 (Spring Boot 2.5 \uBD80\uD130)
spring.sql.init.mode=always

# JWT \uC11C\uBA85\uC5D0 \uC0AC\uC6A9\uB418\uB294 \uBE44\uBC00 \uD0A4
jwt.secret-key=1x9MTBsswbOln4k3kzej5dyD0ymY/ELrl0/WBK8tmFQ=
# JWT \uB9CC\uB8CC \uC2DC\uAC04 (\uBC00\uB9AC\uCD08 \uB2E8\uC704)
# 1\uC77C = 24\uC2DC\uAC04 * 60\uBD84 * 60\uCD08 * 1000\uBC00\uB9AC\uCD08 = 86400000
jwt.expiration=86400000 

# \uCE74\uCE74\uC624\uB9F5 API KEY
kakao.rest-api-key=7a30c76a793325afc62d8f432a99f423

# \uD3EC\uD2B8\uC6D0 REST API \uD0A4 (\uBC31\uC5D4\uB4DC\uC5D0\uC11C \uC0AC\uC6A9)
portone.api.key=
portone.api.secret=

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG